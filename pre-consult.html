<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>사전 상담 · Case-IN</title>
<link rel="stylesheet" href="voice/voice-styles.css">
<style>
:root{font-family:system-ui,'Malgun Gothic',sans-serif;color:#172638;background:#f4f7fb}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column}
.rc-wrap{max-width:520px;margin:0 auto;padding:28px 20px 40px;width:100%}
.rc-header{text-align:center;margin-bottom:18px}
.rc-header strong{font-size:20px;color:#12374d}
.rc-card{background:#fff;border:1px solid #e2ece8;border-radius:18px;padding:26px 22px;box-shadow:0 10px 34px #10243d10}
.rc-card h1{font-size:23px;margin:0 0 16px;color:#12374d;line-height:1.4}
.rc-card p{font-size:17px;line-height:1.75;margin:10px 0;color:#2c3e4a}
.rc-btn{display:block;width:100%;text-align:center;font-size:19px;font-weight:800;padding:20px;border-radius:14px;border:0;cursor:pointer;margin-top:20px}
.rc-btn-primary{background:#137f67;color:#fff}
.rc-btn-secondary{background:#eef4f2;color:#274d43}
.rc-notice{background:#edf8f5;border-left:4px solid #0e8e85;padding:14px 16px;border-radius:10px;font-size:15px;line-height:1.7;margin:16px 0}
.rc-avatar-area{display:flex;flex-direction:column;align-items:center;gap:10px;padding:20px 0 6px}
.rc-findings{margin-top:18px}
.rc-findings h3{font-size:15px;color:#183a48;margin:0 0 8px}
.rc-topics{display:flex;flex-wrap:wrap;gap:8px}
.rc-topic-chip{display:inline-block;background:#eef8f5;border:1px solid #cdeadf;color:#1b604c;font-size:14px;font-weight:700;padding:8px 14px;border-radius:99px}
.rc-hidden{display:none!important}
.rc-center{text-align:center}
.rc-loading{text-align:center;padding:60px 0;color:#7a8b95;font-size:16px}
@media(max-width:480px){.rc-card{padding:22px 16px}.rc-card h1{font-size:21px}}
</style>
</head>
<body>
<div class="rc-wrap">
  <div class="rc-header"><strong>복지인사이트 Case-IN · 사전 상담</strong></div>
  <div id="rcRoot" class="rc-card"><div class="rc-loading">불러오는 중…</div></div>
</div>

<script src="voice/avatar-adapter.js"></script>
<script src="voice/realtime-client.js"></script>
<script src="voice/remote-consult.js"></script>
<script>startRemoteConsult();</script>
</body>
</html>
